<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>흑선행 黑線行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Song+Myung&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== 입문(로그인) 화면 ===================== -->
  <div id="authScreen" class="screen">
    <div class="auth-box">
      <div class="auth-seal"><span>黑</span><span>線</span></div>
      <h1 class="auth-title">흑선행</h1>
      <p class="auth-sub">黑線行 — 선을 넘은 자들을 쫓아</p>
      <p class="auth-lore">정도도, 선도도, 의리도 사라진 강호.<br>흑선채의 탑이 보이는 곳까지 왔다.<br>이제 남은 것은 한 걸음씩 나아가는 일뿐.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">입문</button>
        <button class="auth-tab" data-mode="signup">입적</button>
      </div>

      <form id="authForm" autocomplete="on">
        <label>아이디<input id="authId" type="text" placeholder="영문 소문자, 숫자, _ (3~16자)" autocomplete="username" required></label>
        <label>비밀번호<input id="authPw" type="password" placeholder="6자 이상" autocomplete="current-password" required></label>
        <label id="nickRow" class="hidden">강호에서 쓸 이름<input id="authNick" type="text" maxlength="12" placeholder="캐릭터 이름 (최대 12자)"></label>
        <button type="submit" id="authSubmit" class="btn btn-main">입문하기</button>
      </form>
      <p id="authMsg" class="auth-msg"></p>

      <div class="auth-divider"><span>또는</span></div>
      <button id="localBtn" class="btn btn-ghost">체험 모드로 들어가기</button>
      <p class="auth-note">체험 모드는 이 기기에만 기록되며, 동행(파티)과 전공록을 쓸 수 없습니다.</p>
    </div>
  </div>

  <!-- ===================== 게임 화면 ===================== -->
  <div id="gameScreen" class="screen hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-seal">黑</span><span class="brand-name">흑선행</span></div>
      <div class="stats">
        <div class="stat-name" id="hdrName">—</div>
        <div class="stat"><span class="stat-label">경지</span><span id="hdrLv">1</span></div>
        <div class="stat stat-bar">
          <span class="stat-label">기혈</span>
          <div class="bar"><div class="bar-fill hp" id="hdrHpBar"></div></div>
          <span id="hdrHp" class="stat-num">100/100</span>
        </div>
        <div class="stat stat-bar">
          <span class="stat-label">행동력</span>
          <div class="bar"><div class="bar-fill ap" id="hdrApBar"></div></div>
          <span id="hdrAp" class="stat-num">24/24</span>
        </div>
        <div class="stat"><span class="stat-label">공적</span><span id="hdrMerit">0</span></div>
      </div>
      <button id="logoutBtn" class="btn btn-small btn-ghost">떠나기</button>
    </header>

    <main class="layout">
      <section class="map-col">
        <div class="map-frame">
          <div id="map" class="map"></div>
        </div>
        <p class="map-hint">인접한 칸을 누르거나 방향키(WASD)로 한 칸씩 이동 · 이동마다 행동력 1</p>
      </section>

      <section class="side-col">
        <div class="panel" id="tilePanel"></div>
        <div class="panel log-panel">
          <h3 class="panel-title">행적 <small>行跡</small></h3>
          <div id="log" class="log"></div>
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button class="tab active" data-tab="bag">행낭 <small>行囊</small></button>
      <button class="tab" data-tab="craft">공방 <small>工房</small></button>
      <button class="tab" data-tab="party">동행 <small>同行</small></button>
      <button class="tab" data-tab="rank">전공록 <small>戰功錄</small></button>
    </nav>
    <section class="panel tab-panel" id="tabPanel"></section>
  </div>

  <!-- ===================== 토벌(전투) 창 ===================== -->
  <div id="battleModal" class="modal hidden">
    <div class="modal-box battle-box">
      <h2 class="battle-title" id="battleTitle">토벌</h2>
      <div class="battle-sides">
        <div class="side-units" id="battleAllies"></div>
        <div class="versus">對</div>
        <div class="side-units" id="battleEnemies"></div>
      </div>
      <div class="battle-log" id="battleLog"></div>
      <div class="battle-foot">
        <button id="battleSkip" class="btn btn-small btn-ghost">결과 바로 보기</button>
        <button id="battleClose" class="btn btn-main hidden">물러나기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
